<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorteo CAME + Descuento QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg-1: #f7efe4;
      --bg-2: #fff8ef;
      --card: rgba(255, 255, 255, 0.88);
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #f97316;
      --primary-dark: #ea580c;
      --primary-soft: #ffedd5;
      --success: #16a34a;
      --danger: #dc2626;
      --border: rgba(31, 41, 55, 0.12);
      --shadow: 0 24px 70px rgba(31, 41, 55, 0.18);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(249, 115, 22, 0.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(22, 163, 74, 0.16), transparent 32%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 14px;
    }

    .page-shell {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    .container {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 26px 22px 22px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: -40px;
      background: url("img/diapadre.jpeg") center 34px / 82% auto no-repeat;
      opacity: 0.08;
      filter: saturate(0.95);
      pointer-events: none;
      z-index: 0;
    }

    .container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.70), rgba(255,255,255,0.92));
      pointer-events: none;
      z-index: 0;
    }

    .container > * {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .titulo-img {
      width: min(220px, 74%);
      height: auto;
      margin: 2px auto 10px;
      border-radius: 22px;
      box-shadow: 0 14px 36px rgba(31, 41, 55, 0.14);
      opacity: 0.95;
    }

    .headline {
      margin: 8px 0 4px;
      font-size: clamp(1.55rem, 7vw, 2.15rem);
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 auto 18px;
      max-width: 340px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 14px 0 18px;
    }

    .readonly {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.68);
      color: #374151;
      font-size: 0.95rem;
      text-align: left;
    }

    form { margin: 0; }

    .field {
      margin-bottom: 12px;
      text-align: left;
    }

    .field label {
      display: block;
      margin: 0 0 6px 4px;
      font-size: 0.83rem;
      color: #4b5563;
      font-weight: 700;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 14px 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.86);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    input:focus {
      border-color: rgba(249, 115, 22, 0.72);
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.14);
      transform: translateY(-1px);
    }

    .input-group {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .input-group span {
      padding: 14px 13px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--primary-soft);
      color: #9a3412;
      font-weight: 800;
      white-space: nowrap;
    }

    small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: left;
    }

    button {
      width: 100%;
      min-height: 50px;
      padding: 13px 16px;
      margin-top: 12px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 1rem;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(249, 115, 22, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(249, 115, 22, 0.34);
    }

    button:disabled { opacity: 0.75; cursor: not-allowed; }

    button.processing {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-spinner, .spinner {
      display: inline-block;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-spinner {
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-top-color: #fff;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(249, 115, 22, 0.18);
      border-top-color: var(--primary);
      margin-right: 8px;
      vertical-align: middle;
    }

    .hidden { display: none !important; }

    .error-box {
      color: var(--danger);
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 16px;
      background: rgba(220, 38, 38, 0.08);
      font-size: 0.92rem;
      text-align: left;
    }

    #postParticipacion {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .success-pill {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: auto;
      margin: 4px auto 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.1);
      color: #166534;
      font-weight: 850;
      font-size: 0.9rem;
    }

    #mensajeDescuento {
      margin: 4px 0 14px;
      color: #374151;
      font-size: 1rem;
      line-height: 1.4;
    }

    #loadingMsg {
      margin: 12px 0;
      color: var(--muted);
    }

    .radio-wrapper {
      max-height: 360px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 3px 4px 0;
      margin-bottom: 14px;
    }

    .radio-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-container label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      text-align: left;
      line-height: 1.35;
    }

    .radio-container input[type="radio"] {
      margin-top: 2px;
      accent-color: var(--primary);
      transform: scale(1.15);
    }

    .radio-container a {
      color: var(--primary-dark);
      font-weight: 800;
      text-decoration: none;
    }

    .radio-container a:hover { text-decoration: underline; }

    .qr-card {
      position: relative;
      overflow: hidden;
      width: min(100%, 420px);
      margin: auto;
      padding: 24px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .qr-card::before {
      content: "";
      position: absolute;
      inset: -30px;
      background: url("img/diapadre.jpeg") center / 80% auto no-repeat;
      opacity: 0.07;
      pointer-events: none;
    }

    .qr-card > * { position: relative; z-index: 1; }

    .qr-title {
      margin: 0 0 10px;
      font-size: 1.35rem;
      line-height: 1.2;
      font-weight: 850;
    }

    .qr-warning {
      margin: 8px 0;
      color: var(--danger);
      font-weight: 850;
    }

    .qr-box {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1;
      margin: 18px auto 0;
      padding: 12px;
      border-radius: 24px;
      background: white;
      box-shadow: inset 0 0 0 1px var(--border), 0 14px 30px rgba(31,41,55,0.12);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 390px) {
      body { padding: 14px 10px; }
      .container { padding: 22px 16px 18px; border-radius: 24px; }
      .readonly, input[type="text"], input[type="tel"], .input-group span, button { border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="container">
      <img src="img/ninio2026.jpeg" alt="Sorteo Día del Padre" class="titulo-img">

      <div id="participacion">
        <h1 class="headline">Participá y ganá descuentos</h1>
        <p class="subtitle">Completá tus datos, elegí un comercio adherido y obtené tu QR para canjear.</p>

        <div class="info-grid">
          <div id="comercio" class="readonly"></div>
          <div id="fecha" class="readonly"></div>
        </div>

        <form id="sorteoForm">
          <div class="field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Escribe tu nombre" required>
          </div>

          <div class="field">
            <label for="dni">DNI</label>
            <input type="text" id="dni" placeholder="Últimos 3 dígitos de DNI" maxlength="3" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="celular">Celular</label>
            <div class="input-group">
              <span>+54</span>
              <input type="tel" id="celular" placeholder="Ej: 1123456789" pattern="^\d{10}$" required>
            </div>
            <small>Ingresá el número sin el 9 inicial. Ejemplo: 1123456789</small>
          </div>

          <button type="submit" id="btnParticipar">Participar</button>
        </form>
        <div id="errorParticipacion" class="error-box hidden"></div>
      </div>

      <div id="postParticipacion" class="hidden">
        <div class="success-pill">¡Gracias por participar!</div>
        <!--p id="mensajeDescuento" class="hidden">Te ganaste un descuento en alguno de los siguientes comercios.</p>
        <div id="loadingMsg"><span class="spinner"></span> Cargando comercios...</div>
        <div class="radio-wrapper hidden" id="radioWrapper">
          <form id="radioForm" class="radio-container"></form>
        </div>
        <button id="generarQR" class="hidden">Obtener descuento</button-->
      </div>

      <!--div id="qr-container" class="hidden"></div-->
    </section>
  </main>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyksMJkkDwZR1gGdWTUH4uwX9yrLJlEizsC5jyDLQ8kiwSlPwmikmuWCWShqoMRIVe_Pw/exec';
    let celularGlobal = "";

    const params = new URLSearchParams(window.location.search);
    const comercioNombre = params.get("comercio") || "No especificado";
    const fechaSorteo = params.get("fechaSorteo") || "No especificada";
    document.getElementById('comercio').textContent = `Comercio: ${comercioNombre}`;
    document.getElementById('fecha').textContent = `Fecha: ${fechaSorteo}`;

    function generarHashCorto(input) {
      const hash = Array.from(new TextEncoder().encode(input))
        .reduce((h, c) => (h << 5) - h + c, 0);
      return 'DSCT-' + Math.abs(hash).toString(36).slice(0, 6).toUpperCase();
    }

    document.getElementById('sorteoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      ocultarError();
      const botonParticipar = document.getElementById('btnParticipar');

      if (!botonParticipar.dataset.originalText) {
        botonParticipar.dataset.originalText = botonParticipar.textContent;
      }

      botonParticipar.disabled = true;
      botonParticipar.classList.add('processing');
      botonParticipar.innerHTML = `<span class="btn-spinner"></span> Procesando...`;

      const nombre = document.getElementById('nombre').value.trim();
      const dni = document.getElementById('dni').value.trim();
      const celular = document.getElementById('celular').value.trim();

      if (!/^\d{10}$/.test(celular)) {
        mostrarError("Por favor, ingresá un número válido de celular: 10 dígitos, sin 0 ni 15.");
        resetParticiparButton();
        return;
      }

      celularGlobal = "+54" + celular;

      const formData = new FormData();
      formData.append('comercio', comercioNombre);
      formData.append('fecha', fechaSorteo);
      formData.append('nombre', nombre);
      formData.append('dni', dni);
      formData.append('celular', celularGlobal);

      fetch(scriptURL, { method: 'POST', body: formData })
      .then(response => response.text())
      .then(text => {
        let result;
        try { result = JSON.parse(text); } catch (e) { result = { success: true }; }

        if (result.success === false) {
          mostrarError(result.error || "Ocurrió un error al participar.");
          resetParticiparButton();
          return;
        }

        ocultarError();
        document.getElementById('participacion').classList.add('hidden');
        const post = document.getElementById('postParticipacion');
        post.classList.remove('hidden');
        post.style.display = 'flex';
        cargarComercios();
      })
      .catch(error => {
        mostrarError("Error al enviar los datos. Intentalo de nuevo.");
        console.error(error);
        resetParticiparButton();
      });
    });

    function resetParticiparButton() {
      const botonParticipar = document.getElementById('btnParticipar');
      botonParticipar.disabled = false;
      botonParticipar.classList.remove('processing');
      botonParticipar.textContent = botonParticipar.dataset.originalText || 'Participar';
    }

    function mostrarError(msg) {
      const divError = document.getElementById('errorParticipacion');
      divError.textContent = msg;
      divError.classList.remove('hidden');
    }

    function ocultarError() {
      const divError = document.getElementById('errorParticipacion');
      divError.textContent = "";
      divError.classList.add('hidden');
    }

    function cargarComercios() {
      const mensaje = document.getElementById("mensajeDescuento");
      const loading = document.getElementById("loadingMsg");
      const form = document.getElementById("radioForm");
      const wrapper = document.getElementById("radioWrapper");
      const boton = document.getElementById("generarQR");

      fetch(scriptURL + '?accion=comercios')
        .then(res => res.json())
        .then(data => {
          loading.style.display = "none";

          if (!data.comercios || data.comercios.length === 0) {
            mensaje.style.display = "none";
            return;
          }

          mensaje.classList.remove("hidden");
          form.innerHTML = "";

          data.comercios.forEach((com, index) => {
            const label = document.createElement('label');
            const nombreVisible = com.link
              ? `<a href="${com.link}" target="_blank" rel="noopener noreferrer">${com.nombre}</a> (${com.descripcion})`
              : `${com.nombre} (${com.descripcion})`;

            label.innerHTML = `
              <input type="radio" name="comercio" value="${com.nombre}" ${index === 0 ? 'checked' : ''}>
              <span>${nombreVisible}</span>
            `;

            form.appendChild(label);
          });

          wrapper.classList.remove("hidden");
          boton.classList.remove("hidden");
        })
        .catch(err => {
          console.error("Error cargando comercios:", err);
          loading.textContent = "No se pudieron cargar los comercios.";
        });
    }

    document.getElementById('generarQR').addEventListener('click', function() {
      const btn = this;

      if (!btn.dataset.originalText) {
        btn.dataset.originalText = btn.textContent;
      }

      btn.disabled = true;
      btn.classList.add('processing');
      btn.innerHTML = `<span class="btn-spinner"></span> Procesando...`;

      const seleccionado = document.querySelector('input[name="comercio"]:checked');
      const comercioElegido = seleccionado ? seleccionado.value : "";
      const timestamp = Date.now();
      const raw = celularGlobal + timestamp;
      const codigo = generarHashCorto(raw);
      const descuento = "";

      const qrContent = `https://aleiva-l.github.io/descuento/validar.html?codigo=${codigo}&comercio_codigo=${encodeURIComponent(comercioElegido)}`;

      const datos = new URLSearchParams();
      datos.append("accion", "registro_descuento");
      datos.append("codigo", codigo);
      datos.append("comercio", comercioElegido);
      datos.append("celular", celularGlobal);
      datos.append("descuento", descuento);

      fetch(scriptURL, { method: "POST", body: datos })
      .then(res => res.json())
      .then(result => {
        let fechaMaxCanje = "Sin fecha";
        if (result.fecha_validez) {
          const fechaCompleta = result.fecha_validez.split("T")[0];
          const [anio, mes, dia] = fechaCompleta.split("-");
          fechaMaxCanje = `${dia}/${mes}/${anio}`;
        }

        document.body.innerHTML = '';
        document.body.style.alignItems = 'center';
        document.body.style.padding = '20px';

        const container = document.createElement('div');
        container.className = 'qr-card';

        const texto = document.createElement('div');
        texto.innerHTML = `
          <h1 class="qr-title">Presentá este QR en <strong>${comercioElegido}</strong></h1>
          <p>Válido hasta <strong>${fechaMaxCanje}</strong>.</p>
          <p class="qr-warning">Sujeto a condiciones del comercio</p>
          <p class="qr-warning">Solo válido con efectivo o transferencia</p>`;

        const canvasWrapper = document.createElement('div');
        canvasWrapper.className = 'qr-box';

        QRCode.toCanvas(qrContent, { width: 300 }, function (err, canvas) {
          if (!err) {
            canvas.style.width = '100%';
            canvas.style.height = 'auto';
            canvasWrapper.appendChild(canvas);
            container.appendChild(texto);
            container.appendChild(canvasWrapper);

            const btnDescargar = document.createElement('button');
            btnDescargar.innerText = 'Descargar QR';
            btnDescargar.onclick = () => {
              const link = document.createElement('a');
              link.download = `${codigo}.png`;
              link.href = canvas.toDataURL("image/png");
              link.click();
            };

            const sugerencia = document.createElement('p');
            sugerencia.innerText = 'Descargá el QR y enviátelo por WhatsApp como imagen.';
            sugerencia.style.fontSize = '0.9rem';
            sugerencia.style.marginTop = '10px';
            sugerencia.style.color = '#6b7280';

            container.appendChild(btnDescargar);
            container.appendChild(sugerencia);
            document.body.appendChild(container);
          }
        });
      })
      .catch(err => {
        console.error("Error registrando descuento:", err);
        btn.disabled = false;
        btn.classList.remove('processing');
        btn.textContent = btn.dataset.originalText || 'Obtener descuento';
      });
    });
  </script>
</body>
</html>
